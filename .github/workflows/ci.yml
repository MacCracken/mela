name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version (CLAUDE.md § CI/Release) — no
          # version is hardcoded in this YAML. Read the pin and hand it to the
          # upstream installer, which fetches + lays out $HOME/.cyrius/{bin,lib}.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify dependencies (locked)
        # Resolves the tags and writes nothing; fails, naming the file, if the
        # committed lib/ or cyrius.lock differ from what the tags resolve to.
        run: cyrius deps --locked

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        run: cyrius test

      - name: Fuzz
        run: cyrius fuzz

      - name: Bench (smoke)
        # Exit status is the gate; timings on shared runners are not compared.
        run: cyrius bench

      - name: Coverage floor
        # Reference coverage of src/ fns named by the suite. Raise --min as the
        # v1.1.x coverage catch-up lands; never lower it.
        run: cyrius coverage --min 77

      - name: GNU tar cross-check (ADR-0008)
        # The independent format oracle: mela <-> GNU tar, both directions.
        run: bash scripts/tar-crosscheck.sh

      - name: Live transport check (ADR-0012)
        # mela's real HTTP client against a local python3 server: streaming,
        # size cap, timeouts, redirects, User-Agent, publish metadata.
        run: bash scripts/transport-check.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          for doc in README.md CHANGELOG.md VERSION LICENSE cyrius.cyml; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done
